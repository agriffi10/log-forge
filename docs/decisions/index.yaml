      - title: "A destination's limit is found by halving the *budget*, not the chunk"
        fence: "recursive chunk-halving is `2N-1` requests because each accepted size is rediscovered in every branch; capping the recursion *depth* instead is the trap — a cap of 4 against a 250x ratio delivered 2 events of 2,000. (SPEC-038)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-destinations-limit-is-found-by-halving-the-budget-not-the-chunk.md"
      - title: "A `dropped` count is written only by a `Deferral` commit, and the gate derives which counters are counted"
        fence: "every shipped sink's per-event drop now counts only when its `emit` returns, or on the delivery engine only when its run settles (SPEC-058's rule at every site, where a retried batch had counted one oversized event up to four times); `tests/test_deferral.py` derives each counter some `losses()` reports as `dropped` and refuses any store to it outside `__init__`, with **no allowlist** (a `dropped` count is exact by promise, so breaking it means editing the gate). ~~The socket transport's ledger is entered in the calling sink's `emit` and passed to `send_all` as a required parameter, never defaulted.~~ Superseded by SPEC-074: the transport's round hands `_sendable` the run's `SETTLED` view, still required. (SPEC-059, SPEC-073, SPEC-074)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-dropped-count-is-written-only-by-a-deferral-commit-and-the-gate-derives-which-counters-are-counted.md"
      - title: "A FIFO message group is a trace, not the process"
        fence: "`MessageGroupId` defaults to the event's `trace_id`, which keeps traces parallel instead of serialising everything behind one group. Ordering is best-effort across a retry boundary — since SPEC-074 only past the sink's own retries, a later message being held while an earlier one of its group has sends left — and sender faults are abandoned rather than re-sent. (SPEC-016, SPEC-074)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-fifo-message-group-is-a-trace-not-the-process.md"
      - title: "A Honeycomb batch response is a per-event verdict, read all of a chunk or none of it"
        fence: "`HoneycombSink` reads `/1/batch`'s `200` array positionally: an entry whose integer `status` is outside `2xx` counts on `rejected_events`, never re-sent; a body that is empty or unreadable (`b\"\"`), not an array of objects, the wrong length, or holding a status that is not an `int` (a `bool` and a float are not) counts the whole chunk on `dropped_unadjudicated`, never re-sent; a chunk whose every event was rejected is `REJECTED`, so a run with no accepted event fails (`emit` raises) and, since SPEC-073, is not re-sent. The server's `error` text is never written."
        status: "stable"
        path: "docs/decisions/sink-delivery/a-honeycomb-batch-response-is-a-per-event-verdict-read-all-of-a-chunk-or-none-of-it.md"
      - title: "A populated partial success is counted, never retried; every record rejected raises"
        fence: "a `2xx` whose `partialSuccess.rejectedLogRecords` is in `1 … 2**63-1` counts on `rejected_records`, clamped to the chunk, and the chunk is not re-sent, since a retry would re-send what landed; a chunk whose every record was rejected is `REJECTED`, so a run with no accepted record fails — `emit` raises, `failed_batches` moves, and since SPEC-073 nothing is re-sent, so OTLP's no-retry rule holds too. The line never carries `errorMessage`. (SPEC-056, SPEC-073)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-populated-partial-success-is-counted-never-retried-and-every-record-rejected-raises.md"
      - title: "A positional response adjudicates all of a chunk or none of it"
        fence: "a mismatch is evidence of misalignment, so even the overlapping prefix is refused, and so is a failed count its coded records contradict. What cannot be adjudicated is abandoned and counted (`dropped_unadjudicated`), never retried; a keyed response (SQS, SNS `Failed`, MongoDB `writeErrors`) is read by the same rule. (SPEC-018, SPEC-070, SPEC-074)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-positional-response-adjudicates-all-of-a-chunk-or-none-of-it.md"
      - title: "A protocol's retry set is a private predicate hook, not a second loop"
        fence: "`HTTPSink._retryable_status(status)` is read at one site, `HTTPSink._exchange`, the classification the round and `_send` share, and defaults to `429`/`5xx`; `OTLPSink` narrows it to `429`, `502`, `503`, `504`, so a `500` is abandoned on the first request and every other sink is unchanged by construction. A `413` still halves the budget and re-sends: nothing landed. (SPEC-056, SPEC-073)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-protocols-retry-set-is-a-private-predicate-hook-not-a-second-loop.md"
      - title: "A raising `emit` counts nothing, nor does a `deliver`; whoever catches the raise or receives the failed run owns the batch's count"
        fence: "the worker, the orphan path (`orphan_lost`) and `MultiSink` catch a raising `emit`, so at every shipped site (SPEC-058's five, SPEC-059 the rest, SPEC-069 every sink's encode step) a per-event drop is counted and announced only by an `emit` that returns, through one `Deferral`; counted inside a raising `emit` it is counted once per worker attempt, and `MultiSink` counts every child raise it swallows (reversing SPEC-036 FR-005). A `deliver` counts nothing: the engine is the one writer of `SinkCounters`, a failed run commits no drop and its catcher (worker, orphan path, the adapter's raise) owns the batch, and the engine is a fourth catcher, for a `deliver` that raised. (SPEC-058, SPEC-059, SPEC-069, SPEC-072)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-raising-emit-counts-nothing-whoever-catches-the-raise-owns-the-batchs-count.md"
      - title: "A redirect is a delivery failure, not a route to follow"
        fence: "`urlopen`'s default opener rewrote a redirected `POST` into a body-less `GET`, losing every batch and forwarding the bearer token to a host the caller never configured, while the redirect target's `200` read as delivery. (SPEC-048)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-redirect-is-a-delivery-failure-not-a-route-to-follow.md"
      - title: "A refusal no retry can cure is marked, and the worker abandons it at once"
        fence: "a shipped sink that is closed or closing, or a forked child's `SQLiteSink` or `NATSSink`, raises the `SinkDeliveryError` `sinks/_refusal.final_refusal` builds, exact in type and text and carrying a private instance mark; the worker abandons such a batch at the attempt that raised it, one `failed_batches` and the abandoned line with the attempts made, and `MultiSink` re-raises one only when every child's raise was one. It is final only when the sink that refused is one the package's own graph forwarded the batch to and no caller frame carried it; any other raise, a third-party sink's or a shipped refusal that reached the worker through a sink of the caller's own, keeps the 1.x resend. (maintainer's choice, 2026-11-12)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-refusal-no-retry-can-cure-is-marked-and-the-worker-abandons-it-at-once.md"
      - title: "A sink declares what it retries, and anything else fails at once"
        fence: "every sink retry loop, and since SPEC-074 every engine sink's round, asks `is_retryable(self._retryable_error, err)` and retries only what its sink's predicate names: the driver's documented transient classes, resolved per call and never imported, plus builtin `ConnectionError` and `TimeoutError`. Anything else, a predicate that raises included, is counted and announced at its first attempt with no backoff; `emit` still raises when nothing landed, so the worker re-sends it, except to an engine sink offered `deliver` (the HTTP family since SPEC-073, the SDK, driver and socket sinks since SPEC-074), whose refused events are final. (SPEC-070, SPEC-073, SPEC-074)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-sink-declares-what-it-retries-and-anything-else-fails-at-once.md"
      - title: "A sink imports its extra through `import_extra`, and a missing one is refused naming it"
        fence: "every lazy import of an optional client is `import_extra(module, extra)` (`sinks/_extras.py`): a `ModuleNotFoundError` naming the module or a dotted parent becomes `MissingExtraError`, a private `ModuleNotFoundError` subclass keeping `.name`, `.path` and the interpreter's text and adding the extra and its `pip install`; anything else propagates as the same object. A sink that needs the extra beside an injected client (`AzureEventHubsSink`'s `EventData`) resolves it at construction. A guard reports any other third-party import. (SPEC-071)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-sink-imports-its-extra-through-import-extra-and-a-missing-one-is-refused-naming-it.md"
      - title: "A sink may report per event: `deliver` returns a `Verdict`, and one engine resends only what may land"
        fence: "a sink may add `deliver(batch) -> Verdict`, one closed `Outcome` per event by index, probed statically on its type and offered only with an exact `SinkCounters` and no overriding `emit`; one private engine resends only `RETRYABLE` events within the 1.x total of attempts and the 1.x wait schedule, counts once into the sink's counters, and fails a run only when nothing landed and nothing is unknown. Do NOT add an `Outcome` member before 2.0, declare `deliver` on the `Sink` Protocol, or resend an `UNKNOWN` event for a sink not declaring `log_foundry_idempotent = True`. (SPEC-072)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-sink-may-report-per-event-deliver-returns-a-verdict-and-one-engine-resends-only-what-may-land.md"
      - title: "A sink round resends only what failed, and an SQS FIFO group keeps its order"
        fence: "the SDK, driver and socket sinks make one attempt per chunk, message or frame per round and the delivery engine resends only what may land within 1.x's total budget, so a failed chunk is resent after its round's later ones; only an SQS FIFO message group holds a later message back, per chunk at send time, for its predecessor's `max_retries + 1` sends, and in the run's last round holds nothing. (SPEC-074)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-sink-round-resends-only-what-failed-and-an-sqs-fifo-group-keeps-its-order.md"
      - title: "A sink that delivered nothing raises; one that delivered something reports"
        fence: "a sink that absorbs a total failure is a sink the worker *believes*: retry never engages, counters stay at zero, and `flush()` returns `True` while everything is lost. (SPEC-026, SPEC-043)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-sink-that-delivered-nothing-raises-one-that-delivered-something-reports.md"
      - title: "A sink that released its transport refuses; one that released nothing keeps accepting"
        fence: "both halves bind — three shipped sinks lost every post-`close()` event, while making the stateless sinks refuse would invent loss where a batch would have landed. (SPEC-032)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-sink-that-released-its-transport-refuses-one-that-released-nothing-keeps-accepting.md"
      - title: "A sink's constructor keeps the vendor's own spelling, and types what it forwards"
        fence: "`servers`, `queue_url` and `bootstrap_servers` are the vendors' own words, so the names are frozen rather than normalised; the forwarded HTTP keywords are typed instead. (SPEC-051)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-sinks-constructor-keeps-the-vendors-own-spelling-and-types-what-it-forwards.md"
      - title: "A sink's own driver error is counted, announced and raised as both types"
        fence: "When `SQLiteSink`'s insert raises `sqlite3.Error`, or a `FileSink` or `RotatingFileSink` write or flush raises `OSError`, the sink adds the batch to a private `_failed` at once, writes one line naming the class and type (and `errno=N`), and raises an instance of both `SinkDeliveryError` and the driver's own class, built by `sinks/_driver_error.delivery_error`, which has no public name. (SPEC-069)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-sinks-own-driver-error-is-counted-announced-and-raised-as-both-types.md"
      - title: "A wrapper offers `deliver` exactly when what it wraps does, and counts only its own decisions"
        fence: "`FilteringSink`, `TransformSink` and `LogstashSink` offer `deliver` only when their inner sink or backend does, holding its own `SinkCounters`, its budget copied read-only as the engine reads it, its verdict mapped to their indices; a wrapper counts only `SKIPPED` and a `SETTLED` `_dropped`, declares no idempotence and never calls an inner `emit` from `deliver`. `MultiSink` never offers `deliver`. (SPEC-075)"
        status: "stable"
        path: "docs/decisions/sink-delivery/a-wrapper-offers-deliver-exactly-when-what-it-wraps-does-and-counts-only-its-own-decisions.md"
      - title: "After a status line the status decides; a 2xx whose body cannot be read is never re-sent"
        fence: "before a status line, `URLError`, `OSError` and `http.client.HTTPException` are `RETRYABLE`, resent by the engine within its budget, and counted in `failed` for the last round's request; after one, a body read that fails is an `_UnreadBody`, equal to `b\"\"`, and the status decides — a `2xx` is what its reader returns (`UNKNOWN` for a body reader that cannot read it), a retryable status is `RETRYABLE`, a `413` drives the search, any other is `REJECTED`. `_handle_response` keeps `bytes`; `_read_failed` tells an unreadable body from an empty one. (SPEC-073)"
        status: "stable"
        path: "docs/decisions/sink-delivery/after-a-status-line-the-status-decides-a-2xx-whose-body-cannot-be-read-is-never-re-sent.md"
      - title: "An argument door asks the type, never the value"
        fence: "an argument door — `configure()`'s stamps and ceilings, the `_retry` validators, `OTLPSink`'s endpoint, `_args.require_callable` — tests `issubclass(type(v), T)`, never `isinstance`, and names the type as `_diag._STR_STR(_diag._STORED_NAME(type(v)))`, never `type(v).__name__`, so no `__class__` or metaclass `__name__` the caller wrote runs and the message names the argument and the real class. The only `isinstance` on a door's parameter is `decorator._refuse_unusable`'s two kept proxy tests, held as an exact multiset; `@trace`'s half is SPEC-080's decision in `trace-model`. A guard holds the doors as an exact set of ten. (SPEC-071)"
        status: "stable"
        path: "docs/decisions/sink-delivery/an-argument-door-asks-the-type-never-the-value.md"
      - title: "An event a sink cannot encode costs only itself, and a batch of nothing encodable settles, counted"
        fence: "Every record-building sink encodes the whole batch through `sinks/_encode.encode_events` before its first bulk call, outside any lock or retry loop; an event it cannot encode is dropped alone, counted `dropped` by the call's `Deferral` and announced once per call by type, and a batch of nothing encodable returns rather than raising. `NATSSink` and `SentrySink` keep counting it `failed`. (SPEC-069)"
        status: "stable"
        path: "docs/decisions/sink-delivery/an-event-a-sink-cannot-encode-costs-only-itself-and-a-batch-of-nothing-encodable-settles-counted.md"
      - title: "`auth` beside an `Authorization` header is refused, never resolved by precedence"
        fence: "`auth=` beside an `Authorization` header in any case, matched by the name `urllib` sends (`http._wire_name`), is a `ValueError` at construction from `HTTPSink` and every sink forwarding `auth`, judged before the credential and naming no value; `SplunkHECSink`, which sends its token as that header, refuses any `auth=`. Credentials are copied once, as exact `str`, and every request sends the value built then; `\"\"` and `(\"\", \"\")` are refused after the conflict, a pair with one empty half is not. Do NOT resolve the conflict by letting either side win, or match the header by exact case. A caller header naming a platform sink's own credential header is refused under *A caller header that would silently replace another is refused*. (HTTP auth fix and the 1.2.0 follow-up fix, no spec)"
        status: "stable"
        path: "docs/decisions/sink-delivery/auth-beside-an-authorization-header-is-refused-never-resolved-by-precedence.md"
      - title: "Caller code that fails for one event costs only that event; a batch of nothing but failures re-raises"
        fence: "`TransformSink`'s function, `FilteringSink`'s predicate and `SQSSink`'s FIFO id callables drop the one event, counted once the inner `emit` returned and announced once per batch by exception *type*; when every event failed the first exception is re-raised unchanged and nothing is counted. A batch of nothing the sink's *own* encode can take settles instead, counted — HTTP's unrenderable batch (SPEC-058) and, since SPEC-069, every record-building sink's: re-encoding identical input fails identically. (SPEC-058, SPEC-069)"
        status: "stable"
        path: "docs/decisions/sink-delivery/caller-code-that-fails-for-one-event-costs-only-that-event-a-batch-of-nothing-but-failures-re-raises.md"
      - title: "No shipped sink declares itself idempotent"
        fence: "an `UNKNOWN` outcome or an exception escaping `deliver` is never resent, because no destination the library ships de-duplicates a resend the sink can see or bound: Kinesis and Firehose leave duplicates to the destination, SNS and SQS standard queues de-duplicate nothing, ClickHouse only under settings the table's owner chooses, Postgres has no conflict clause, the brokers deliver every copy, MongoDB would turn the duplicate into a miscounted rejection, and SQS FIFO's 5-minute window is unmeasured and the same class writes standard queues. (SPEC-074)"
        status: "stable"
        path: "docs/decisions/sink-delivery/no-shipped-sink-declares-itself-idempotent.md"
      - title: "The envelope is charged per record, and the wrapper withheld"
        fence: "`OTLPSink._item_size` charges every record its own resource group's framing — `_otel.framing(key, version)`, the difference in UTF-8 bytes between a request holding one empty record and an empty one — plus its separator, and `_body_reserve` withholds the `{\"resourceLogs\":[]}` wrapper; `LokiSink`'s method, over-counting when events share a resource, which is the safe direction. (SPEC-056)"
        status: "stable"
        path: "docs/decisions/sink-delivery/the-envelope-is-charged-per-record-and-the-wrapper-withheld.md"
      - title: "The HTTP family delivers in rounds on the engine, and a run context keeps its counters' units"
        fence: "`HTTPSink` and its eight subclasses offer `deliver`: a round sends each chunk in one request, and the engine owns every resend and wait within the 1.x total. A family-neutral run context keeps `failed` in requests and every counter in its 1.x unit. Moves: a total failure counts once per batch, a lone `413` beside a failed batch is the catcher's, a request-building fault is `dropped`, a raising `2xx` reader is `dropped_unadjudicated`. An `emit` override or a bool `_handle_response` keeps its 1.x path. (SPEC-073)"
        status: "stable"
        path: "docs/decisions/sink-delivery/the-http-family-delivers-in-rounds-and-a-run-context-keeps-its-counters-units.md"
      - title: "The response is read under a bound, and an oversized non-2xx is abandoned whatever its status"
        fence: "`HTTPSink._response_limit()` defaults to `None`, the bare `read()` every sink and test double relies on; `OTLPSink` returns 4 MiB, `_attempt` reads one byte past it, `_exchange` (the classification the round and `_send` share) abandons a longer non-`2xx` as `REJECTED` whatever its status — a `413` included, literally — and the reader judges a `2xx` against the same bound. No instance flag: the orphan path shares one sink across threads. (SPEC-056, SPEC-073)"
        status: "stable"
        path: "docs/decisions/sink-delivery/the-response-is-read-under-a-bound-and-an-oversized-non-2xx-is-abandoned-whatever-its-status.md"
      - title: "The sink is a durable buffer, not the final store"
        fence: "ship to SQS, which absorbs spikes and outages, and let a separate consumer index into ELK. `StdoutSink` is the zero-dep default. (arch §8, §9.1)"
        status: "stable"
        path: "docs/decisions/sink-delivery/the-sink-is-a-durable-buffer-not-the-final-store.md"
      - title: "The sinks keep four declared exceptions to their shared rules"
        fence: "four departures from a shared sink rule are deliberate, and each is a row here naming its rule, classes, reason, decision and proof: Kafka, NATS, Pub/Sub and PostgreSQL floor a timeout that works; `OTLPSink` abandons a `500`; `GooglePubSubSink` counts a close mid-batch; `OTLPSink` reads an empty `2xx` body as success. A roster derives each row from the tree, so a fifth fails until it is a row. (SPEC-070)"
        status: "stable"
        path: "docs/decisions/sink-delivery/the-sinks-keep-four-declared-exceptions-to-their-shared-rules.md"
  - name: "Sink contract: waiting, concurrency and shutdown"
    slug: "sink-lifecycle"
    path: "docs/decisions/sink-lifecycle/sink-lifecycle.md"
    governs: ["src/log_foundry/sinks/**"]
    decisions:
      - title: "A closing sink refuses at once; a SERIAL close waits for the one call inside, a CLOSE_ONLY close waits a bounded time"
        fence: "a close sets `CLOSING` before it takes the transport lock, so every later caller is refused; a `SERIAL` close then waits for the one section holding the lock and never releases under it, and a `CLOSE_ONLY` close waits at most `CLOSE_OVERLAP_WAIT` (0.5 s) and releases, telling the section it overtook (`released_during`), which `KafkaSink` counts. Never an `RLock`; never a release handed to the call inside. (SPEC-076)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-closing-sink-refuses-at-once-a-serial-close-waits-for-the-one-call-inside-a-close-only-close-waits-a-bounded-time.md"
      - title: "A driver's liveness flag is not evidence: a sink that cannot see the wire asks the server, and never cancels a wait the server may still answer"
        fence: "`is_connected` flips only when the driver's own tasks notice, and those tasks need loop time between calls; a sink that reports delivery on the flag reports it for events that never left the process, and a PONG wait the sink cancels kills the driver's reader when the answer arrives late. (SPEC-061)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-drivers-liveness-flag-is-not-evidence-a-sink-that-cannot-see-the-wire-asks-the-server-and-never-cancels-a-wait-the-server-may-still-answer.md"
      - title: "A hand the worker build or a retarget declines for a close in flight is paid when that close finishes"
        fence: "while a stop is running, a worker build whose sink has a close in flight, or a `Worker.retarget` onto such a sink (`_hand_retargeted`), hands it no stop signal and marks that close (`_CloseRegistry.defer_hand`); the entry's discharge hands the current signal, never a refreshed one, where `_will_hand` allows, under no lock (`_hand_after_close`; `put_back` pays after releasing `_state._lock`); a mark whose close outlives the stop is paid by the last stop out or, landing after that stop looked, by its writer (`_pay_marks_after_stop`), and a payment reached inside a hand of that very sink runs when its thread leaves that sink's hand (`handing`). Never settle it through `_signal_owed`, never pay under `_state._lock`, never defer outside a stop. (fix after SPEC-079)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-hand-the-worker-build-declines-for-a-close-in-flight-is-paid-when-that-close-finishes.md"
      - title: "A hand while a stop has a take ahead hands the current signal and never refreshes it"
        fence: "while a `shutdown()` still has a take of the owed record ahead of it (`Runtime._take_ahead`), the orphan log's locked branch and `flush()`'s section hand a sink the current stop signal as it is, set or not, and open a hand token only when they publish an arm, a cleared debt or a real refresh (`_refreshes`); the swap's no-worker branch returns before its hand while a take is ahead, and the factory wrapper only relays what it was handed. Never gate it on the whole stop (`_stops_running`), never pay a refusal through a mark or `_signal_owed`. (fix after SPEC-079)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-hand-while-a-stop-has-a-take-ahead-hands-the-current-signal-and-never-refreshes-it.md"
      - title: "A process releases only a transport it acquired *here*, and unrecorded must be unclaimable rather than merely unreleasable"
        fence: "the record is stamped when the library is *handed* a sink, over the whole reachable graph, and every close consults it. Write-once alone defends only a record that already exists. (SPEC-042)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-process-releases-only-a-transport-it-acquired-here-and-unrecorded-must-be-unclaimable-rather-than-merely-unreleasable.md"
      - title: "A shutdown shortens a *wait*; it must never skip *work*"
        fence: "the stop event is set for the whole of `_final_drain`, so any sink consulting it to do *less* degrades itself on the exit drain — the one path a serverless process has. (SPEC-038)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-shutdown-shortens-a-wait-it-must-never-skip-work.md"
      - title: "A sink factory builds each process's own sink lazily, and sink= refuses only what can never work"
        fence: "`configure(sink_factory=f)` never calls `f`: the first emit in each process does, through a private wrapper, and a forked child is handed a new wrapper and builds its own — never in the at-fork handler. A failed build is a counted delivery failure the next emit retries. `sink=` and the wrappers' inner sinks are refused only when exactly one of a closed list of builtin types, or when the graph loops back through a package wrapper; a missing `close` is never refused. (SPEC-079, sink-loop fix; arch §13; invariants §13)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-sink-factory-builds-each-processs-own-sink-lazily-and-sink-refuses-only-what-can-never-be-a-sink.md"
      - title: "A sink factory runs under no lock, and a build that calls back releases its waiters"
        fence: "`_FactorySink` holds its build lock only to claim a build and to record its result, never across the factory call; a concurrent first emit waits on the build with no lock held, and for the length of a `flush()`, `shutdown()` or sink-changing `configure()` the factory makes, every emit waiting on that build or arriving at it refuses as a delivery failure instead. Never hold a lock across the factory, never refuse a waiter on a build whose factory is not inside one of those three calls, never let a yield outlast its call. (fix after SPEC-079)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-sink-factory-runs-under-no-lock-and-a-build-that-calls-back-releases-its-waiters.md"
      - title: "A sink handoff is owned by whoever is delivering, and \"a worker exists\" is not \"a worker owns this sink\""
        fence: "the orphan path records the sink **object** an emit reached, because `configure()` assigns `_config.sink` *before* the swap runs and a boolean cannot tell the two apart. **An owed close survives the moment that forbade it** — an unconfirmed swap leaves the previous sink open *for now*: the objection expires when the drain thread does. (SPEC-033, SPEC-050)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-sink-handoff-is-owned-by-whoever-is-delivering-and-a-worker-exists-is-not-a-worker-owns-this-sink.md"
      - title: "A sink tolerates concurrent callers; the library cannot serialize them for it"
        fence: "a level call with no active span emits on the *caller's* thread, so `emit`/`close` are called concurrently against one sink object. It is a requirement on implementations, not a promise the library can keep. (SPEC-028)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-sink-tolerates-concurrent-callers-the-library-cannot-serialize-them-for-it.md"
      - title: "A sink's wait is bounded, interruptible, and never taken on a destination's word"
        fence: "one drain thread means a sink's backoff pauses *all* delivery and spans `shutdown()`, so every sink waits on the worker's stop event and `time.sleep` is the wrong primitive. (SPEC-027, SPEC-038, SPEC-047)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-sinks-wait-is-bounded-interruptible-and-never-taken-on-a-destinations-word.md"
      - title: "A stop-signal setter runs under no lock its own calls would wait on: the owner decides, then hands"
        fence: "the library never runs a sink's `log_foundry_stop_signal` setter, or the `hasattr` probe before it, under a lock a call from inside the setter would wait on: the owner decides under `_state._lock`, opens a hand token before the section publishes an arm, a refreshed `_stop` or a cleared debt, hands after releasing, and re-checks lock-free that the sink holds the current signal. One section publishes with no token: a worker build that, during a stop, defers its hand to a close of its sink in flight, since `_will_hand` refuses that sink to every thread a token would redirect. The factory wrapper hands what it built under no lock. Never hand inside a lifecycle critical section, never publish before the token but there, never open a token for a hand that published nothing. (fix after SPEC-079)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-stop-signal-setter-runs-under-no-lock-its-own-calls-would-wait-on-the-owner-decides-then-hands.md"
      - title: "A terminal `shutdown()` and a captured sink are both reported, not prevented"
        fence: "logging after `shutdown()` is still *accepted* — refusing would hide the mistake and restarting the worker would fight a process trying to exit. `Health` reports the **pair** `retired` + `submitted_after_shutdown`. (SPEC-030)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-terminal-shutdown-and-a-captured-sink-are-both-reported-not-prevented.md"
      - title: "A value on the wire is measured on the clock that cannot move"
        fence: "rotation deadlines are `time.monotonic()`, since a wall-clock deadline is defeated by any step larger than the interval. The *label* stays wall-clock wherever one exists. (SPEC-031)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-value-on-the-wire-is-measured-on-the-clock-that-cannot-move.md"
      - title: "The exit drain declines only a retry predicted to end past the shutdown deadline"
        fence: "the exit drain makes every batch's first attempt and declines a retry only when the batch's longest attempt plus a 0.1 s join margin is predicted to end past the `shutdown()` deadline; the budget is the caller's `timeout`, so there is no knob. (SPEC-062)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/the-exit-drain-declines-only-a-retry-predicted-to-end-past-the-shutdown-deadline.md"
  - name: "Trace model and context"
    slug: "trace-model"
    path: "docs/decisions/trace-model/trace-model.md"
    governs: ["src/log_foundry/context.py", "src/log_foundry/decorator.py", "src/log_foundry/ids.py"]
    decisions:
      - title: "Boundary events take the span's *final* baggage; mid-span events keep the moment's"
        fence: "backfill only at close. Backfilling everything inverts `build_event`'s precedence and lets baggage beat a per-call field. (SPEC-015)"
        status: "stable"
        path: "docs/decisions/trace-model/boundary-events-take-the-spans-final-baggage-mid-span-events-keep-the-moments.md"
      - title: "Context via `contextvars`"
        fence: "not thread-locals — correct under threads and asyncio; holds a span stack plus baggage. (arch §5)"
        status: "stable"
        path: "docs/decisions/trace-model/context-via-contextvars.md"
      - title: "Cross-process traces are adopted explicitly, never auto-instrumented"
        fence: "no client patching or middleware, which would need the deps the core refuses. Inbound context is untrusted and confers no authority. (SPEC-014)"
        status: "stable"
        path: "docs/decisions/trace-model/cross-process-traces-are-adopted-explicitly-never-auto-instrumented.md"
      - title: "IDs are W3C Trace Context compatible"
        fence: "`trace_id` 16B/32hex, `span_id` 8B/16hex, `log_id` UUID, so adopting tracing later stays cheap. (arch §3.1)"
        status: "stable"
        path: "docs/decisions/trace-model/ids-are-w3c-trace-context-compatible.md"
      - title: "Per-request context is released at the root span — baggage restored, an adopted trace context cleared"
        fence: "the asymmetry is deliberate: restoring an inbound context puts back an adoption made *before* the span, leaving a warm container joining the first caller's trace forever. (SPEC-024)"
        status: "stable"
        path: "docs/decisions/trace-model/per-request-context-is-released-at-the-root-span--baggage-restored-an-adopted-trace-context-cleared.md"
      - title: "The outbound baggage header renders through assembly's coercion and is capped by whole members"
        fence: "one `sanitize_fields` pass over the baggage, guarded at render not intake; at most `BAGGAGE_MAX_BYTES` as a prefix, never a packing; an empty key skipped; a drop announced as a count, never a key. (SPEC-064)"
        status: "stable"
        path: "docs/decisions/trace-model/the-outbound-baggage-header-renders-through-assemblys-coercion-and-is-capped-by-whole-members.md"
      - title: "`@trace` routes what it is handed on its real type, and only a callable runs its own code at decoration"
        fence: "`@trace` routes the values it is handed (`name=`, a `__qualname__`, a type name, the `str` it refuses) on their real type, keeps a `str` as the exact `str` it holds and reads type names through `type`'s own descriptor; of the decorated object only a callable runs its own code at decoration, bar the `__func__` and `__qualname__` read for a real `classmethod` or `staticmethod`'s message, and the misordered-descriptor test keeps `isinstance`, last, for callables, on purpose. (SPEC-080)"
        status: "stable"
        path: "docs/decisions/trace-model/trace-routes-what-it-is-handed-on-its-real-type-and-only-a-callable-runs-its-own-code-at-decoration.md"
      - title: "Unit of work = a decorated call"
        fence: "`@log_foundry.trace`; the outermost call starts a trace, every call is a span within it. Named once at decoration, where a misordered descriptor, a non-callable or a generator function is refused. (arch §4, SPEC-055)"
        status: "stable"
        path: "docs/decisions/trace-model/unit-of-work--a-decorated-call.md"
  - name: "Working rules: findings, rosters and testing bounds"
    slug: "working-rules"
    path: "docs/decisions/working-rules/working-rules.md"
    governs: ["tests/**", "scripts/*.sh", "scripts/*.py"]
    decisions:
      - title: "A bound is only a bound if it is measured where it binds"
        fence: "assert **CPU** time, not wall clock, or a busy-spin passes; a timeout applied per *item* is `n × timeout`, not a bound. (SPEC-038)"
        status: "stable"
        path: "docs/decisions/working-rules/a-bound-is-only-a-bound-if-it-is-measured-where-it-binds.md"
      - title: "A read-only finding is not closed until it has been run, and the job that runs it needs a floor rather than an exit code"
        fence: "fourteen sink modules reach a third party through eleven optional extras and none was ever executed, so the sinks most likely to be in production were the least verified. **A floor, not an exit code:** a fixture that skips on an absent service exits **0**, so a dropped module reads as a smaller pass count and nothing fails — an absent service must fail, and a per-module floor makes a silent shrink loud. (SPEC-041)"
        status: "stable"
        path: "docs/decisions/working-rules/a-read-only-finding-is-not-closed-until-it-has-been-run-and-the-job-that-runs-it-needs-a-floor-rather-than-an-exit-code.md"
      - title: "A rule with no gate is a rule that rots, and the cap that rots is the one contradicted by its neighbour"
        fence: "the ≤3-sentence docstring cap sat beside \"reasoning ... belongs *in* the docstring\" and the code followed the neighbour, a third of defs over it. Re-scoped to the **summary line**, where compliance was already total, so `scripts/docstring-lint.py` shipped green. Its corpus mutation-tests every **exemption**, not just every check. (SPEC-052)"
        status: "stable"
        path: "docs/decisions/working-rules/a-rule-with-no-gate-is-a-rule-that-rots-and-the-cap-that-rots-is-the-one-contradicted-by-its-neighbour.md"
      - title: "A subclass that inherits a method is still in the roster"
        fence: "scope a roster on defines-or-inherits: keying on *defining* a method made membership a function of where code sits, and dropped five classes out of two lints in one commit with the suite green. (SPEC-038)"
        status: "stable"
        path: "docs/decisions/working-rules/a-subclass-that-inherits-a-method-is-still-in-the-roster.md"
      - title: "An open item is closed by being fixed, settled, or recorded as a constraint — never deleted"
        fence: "a note merely removed takes its reasoning with it, and a reader cannot tell a live defect from a decision that reads like one. Supersede in place, struck through and marked with the spec that closed it. (SPEC-021)"
        status: "stable"
        path: "docs/decisions/working-rules/an-open-item-is-closed-by-being-fixed-settled-or-recorded-as-a-constraint--never-deleted.md"
      - title: "The supported-Python versions have one authority — the CI matrix — and restatements are bound to it, not to each other"
        fence: "the matrix is the only site that is *evidence* rather than a claim; a *set* claim must equal it, a *floor* claim its minimum, and the boundary is the LINE, not the file. What it does **not** establish — that the matrix was *triggered*, or that a line outside the swept files agrees — is recorded, not chased with a further check. (No spec — PR #200)"
        status: "stable"
        path: "docs/decisions/working-rules/the-supported-python-versions-have-one-authority--the-ci-matrix--and-restatements-are-bound-to-it-not-to-each-other.md"
