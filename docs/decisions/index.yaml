        path: "docs/decisions/sink-delivery/after-a-status-line-the-status-decides-a-2xx-whose-body-cannot-be-read-is-never-re-sent.md"
      - title: "Caller code that fails for one event costs only that event; a batch of nothing but failures re-raises"
        fence: "`TransformSink`'s function, `FilteringSink`'s predicate and `SQSSink`'s FIFO id callables drop the one event, counted once the inner `emit` returned and announced once per batch by exception *type*; when every event failed the first exception is re-raised unchanged and nothing is counted. An all-unrenderable HTTP batch settles instead, counted — re-rendering identical input fails identically. (SPEC-058)"
        status: "stable"
        path: "docs/decisions/sink-delivery/caller-code-that-fails-for-one-event-costs-only-that-event-a-batch-of-nothing-but-failures-re-raises.md"
      - title: "The envelope is charged per record, and the wrapper withheld"
        fence: "`OTLPSink._item_size` charges every record its own resource group's framing — `_otel.framing(key, version)`, the difference in UTF-8 bytes between a request holding one empty record and an empty one — plus its separator, and `_body_reserve` withholds the `{\"resourceLogs\":[]}` wrapper; `LokiSink`'s method, over-counting when events share a resource, which is the safe direction. (SPEC-056)"
        status: "stable"
        path: "docs/decisions/sink-delivery/the-envelope-is-charged-per-record-and-the-wrapper-withheld.md"
      - title: "The response is read under a bound, and an oversized non-2xx is abandoned whatever its status"
        fence: "`HTTPSink._response_limit()` defaults to `None`, the bare `read()` every sink and test double relies on; `OTLPSink` returns 4 MiB, `_attempt` reads one byte past it, `_send` abandons a longer non-`2xx` as non-retryable whatever its status — a `413` included, literally — and `_handle_response` judges a `2xx` against the same bound. No instance flag: the orphan path shares one sink across threads. (SPEC-056)"
        status: "stable"
        path: "docs/decisions/sink-delivery/the-response-is-read-under-a-bound-and-an-oversized-non-2xx-is-abandoned-whatever-its-status.md"
      - title: "The sink is a durable buffer, not the final store"
        fence: "ship to SQS, which absorbs spikes and outages, and let a separate consumer index into ELK. `StdoutSink` is the zero-dep default. (arch §8, §9.1)"
        status: "stable"
        path: "docs/decisions/sink-delivery/the-sink-is-a-durable-buffer-not-the-final-store.md"
  - name: "Sink contract: waiting, concurrency and shutdown"
    slug: "sink-lifecycle"
    path: "docs/decisions/sink-lifecycle/sink-lifecycle.md"
    governs: ["src/log_foundry/sinks/**"]
    decisions:
      - title: "A process releases only a transport it acquired *here*, and unrecorded must be unclaimable rather than merely unreleasable"
        fence: "the record is stamped when the library is *handed* a sink, over the whole reachable graph, and every close consults it. Write-once alone defends only a record that already exists. (SPEC-042)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-process-releases-only-a-transport-it-acquired-here-and-unrecorded-must-be-unclaimable-rather-than-merely-unreleasable.md"
      - title: "A shutdown shortens a *wait*; it must never skip *work*"
        fence: "the stop event is set for the whole of `_final_drain`, so any sink consulting it to do *less* degrades itself on the exit drain — the one path a serverless process has. (SPEC-038)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-shutdown-shortens-a-wait-it-must-never-skip-work.md"
      - title: "A sink handoff is owned by whoever is delivering, and \"a worker exists\" is not \"a worker owns this sink\""
        fence: "the orphan path records the sink **object** an emit reached, because `configure()` assigns `_config.sink` *before* the swap runs and a boolean cannot tell the two apart. **An owed close survives the moment that forbade it** — an unconfirmed swap leaves the previous sink open *for now*: the objection expires when the drain thread does. (SPEC-033, SPEC-050)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-sink-handoff-is-owned-by-whoever-is-delivering-and-a-worker-exists-is-not-a-worker-owns-this-sink.md"
      - title: "A sink tolerates concurrent callers; the library cannot serialize them for it"
        fence: "a level call with no active span emits on the *caller's* thread, so `emit`/`close` are called concurrently against one sink object. It is a requirement on implementations, not a promise the library can keep. (SPEC-028)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-sink-tolerates-concurrent-callers-the-library-cannot-serialize-them-for-it.md"
      - title: "A sink's wait is bounded, interruptible, and never taken on a destination's word"
        fence: "one drain thread means a sink's backoff pauses *all* delivery and spans `shutdown()`, so every sink waits on the worker's stop event and `time.sleep` is the wrong primitive. (SPEC-027, SPEC-038, SPEC-047)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-sinks-wait-is-bounded-interruptible-and-never-taken-on-a-destinations-word.md"
      - title: "A terminal `shutdown()` and a captured sink are both reported, not prevented"
        fence: "logging after `shutdown()` is still *accepted* — refusing would hide the mistake and restarting the worker would fight a process trying to exit. `Health` reports the **pair** `retired` + `submitted_after_shutdown`. (SPEC-030)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-terminal-shutdown-and-a-captured-sink-are-both-reported-not-prevented.md"
      - title: "A value on the wire is measured on the clock that cannot move"
        fence: "rotation deadlines are `time.monotonic()`, since a wall-clock deadline is defeated by any step larger than the interval. The *label* stays wall-clock wherever one exists. (SPEC-031)"
        status: "stable"
        path: "docs/decisions/sink-lifecycle/a-value-on-the-wire-is-measured-on-the-clock-that-cannot-move.md"
  - name: "Trace model and context"
    slug: "trace-model"
    path: "docs/decisions/trace-model/trace-model.md"
    governs: ["src/log_foundry/context.py", "src/log_foundry/decorator.py", "src/log_foundry/ids.py"]
    decisions:
      - title: "Boundary events take the span's *final* baggage; mid-span events keep the moment's"
        fence: "backfill only at close. Backfilling everything inverts `build_event`'s precedence and lets baggage beat a per-call field. (SPEC-015)"
        status: "stable"
        path: "docs/decisions/trace-model/boundary-events-take-the-spans-final-baggage-mid-span-events-keep-the-moments.md"
      - title: "Context via `contextvars`"
        fence: "not thread-locals — correct under threads and asyncio; holds a span stack plus baggage. (arch §5)"
        status: "stable"
        path: "docs/decisions/trace-model/context-via-contextvars.md"
      - title: "Cross-process traces are adopted explicitly, never auto-instrumented"
        fence: "no client patching or middleware, which would need the deps the core refuses. Inbound context is untrusted and confers no authority. (SPEC-014)"
        status: "stable"
        path: "docs/decisions/trace-model/cross-process-traces-are-adopted-explicitly-never-auto-instrumented.md"
      - title: "IDs are W3C Trace Context compatible"
        fence: "`trace_id` 16B/32hex, `span_id` 8B/16hex, `log_id` UUID, so adopting tracing later stays cheap. (arch §3.1)"
        status: "stable"
        path: "docs/decisions/trace-model/ids-are-w3c-trace-context-compatible.md"
      - title: "Per-request context is released at the root span — baggage restored, an adopted trace context cleared"
        fence: "the asymmetry is deliberate: restoring an inbound context puts back an adoption made *before* the span, leaving a warm container joining the first caller's trace forever. (SPEC-024)"
        status: "stable"
        path: "docs/decisions/trace-model/per-request-context-is-released-at-the-root-span--baggage-restored-an-adopted-trace-context-cleared.md"
      - title: "Unit of work = a decorated call"
        fence: "`@log_foundry.trace`; the outermost call starts a trace, every call is a span within it. Named once at decoration, where a misordered descriptor, a non-callable or a generator function is refused. (arch §4, SPEC-055)"
        status: "stable"
        path: "docs/decisions/trace-model/unit-of-work--a-decorated-call.md"
  - name: "Working rules: findings, rosters and testing bounds"
    slug: "working-rules"
    path: "docs/decisions/working-rules/working-rules.md"
    governs: ["tests/**", "scripts/*.sh", "scripts/*.py"]
    decisions:
      - title: "A bound is only a bound if it is measured where it binds"
        fence: "assert **CPU** time, not wall clock, or a busy-spin passes; a timeout applied per *item* is `n × timeout`, not a bound. (SPEC-038)"
        status: "stable"
        path: "docs/decisions/working-rules/a-bound-is-only-a-bound-if-it-is-measured-where-it-binds.md"
      - title: "A read-only finding is not closed until it has been run, and the job that runs it needs a floor rather than an exit code"
        fence: "fourteen sink modules reach a third party through eleven optional extras and none was ever executed, so the sinks most likely to be in production were the least verified. **A floor, not an exit code:** a fixture that skips on an absent service exits **0**, so a dropped module reads as a smaller pass count and nothing fails — an absent service must fail, and a per-module floor makes a silent shrink loud. (SPEC-041)"
        status: "stable"
        path: "docs/decisions/working-rules/a-read-only-finding-is-not-closed-until-it-has-been-run-and-the-job-that-runs-it-needs-a-floor-rather-than-an-exit-code.md"
      - title: "A rule with no gate is a rule that rots, and the cap that rots is the one contradicted by its neighbour"
        fence: "the ≤3-sentence docstring cap sat beside \"reasoning ... belongs *in* the docstring\" and the code followed the neighbour, a third of defs over it. Re-scoped to the **summary line**, where compliance was already total, so `scripts/docstring-lint.py` shipped green. Its corpus mutation-tests every **exemption**, not just every check. (SPEC-052)"
        status: "stable"
        path: "docs/decisions/working-rules/a-rule-with-no-gate-is-a-rule-that-rots-and-the-cap-that-rots-is-the-one-contradicted-by-its-neighbour.md"
      - title: "A subclass that inherits a method is still in the roster"
        fence: "scope a roster on defines-or-inherits: keying on *defining* a method made membership a function of where code sits, and dropped five classes out of two lints in one commit with the suite green. (SPEC-038)"
        status: "stable"
        path: "docs/decisions/working-rules/a-subclass-that-inherits-a-method-is-still-in-the-roster.md"
      - title: "An open item is closed by being fixed, settled, or recorded as a constraint — never deleted"
        fence: "a note merely removed takes its reasoning with it, and a reader cannot tell a live defect from a decision that reads like one. Supersede in place, struck through and marked with the spec that closed it. (SPEC-021)"
        status: "stable"
        path: "docs/decisions/working-rules/an-open-item-is-closed-by-being-fixed-settled-or-recorded-as-a-constraint--never-deleted.md"
      - title: "The supported-Python versions have one authority — the CI matrix — and restatements are bound to it, not to each other"
        fence: "the matrix is the only site that is *evidence* rather than a claim; a *set* claim must equal it, a *floor* claim its minimum, and the boundary is the LINE, not the file. What it does **not** establish — that the matrix was *triggered*, or that a line outside the swept files agrees — is recorded, not chased with a further check. (No spec — PR #200)"
        status: "stable"
        path: "docs/decisions/working-rules/the-supported-python-versions-have-one-authority--the-ci-matrix--and-restatements-are-bound-to-it-not-to-each-other.md"
