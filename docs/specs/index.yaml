  - id: "SPEC-064"
    title: "Bounded, Total Baggage Header — Rendered Through Assembly's Coercion and Capped by Whole Members"
    description: "Renders the outbound baggage header through assembly's bounded coercion and caps it at 8192 bytes by whole members, so current_baggage_header() always returns and its output always parses."
    spec_status: "Completed"
    depends_on: ["SPEC-014", "SPEC-057"]
    path: "docs/specs/SPEC-064-bounded-baggage-header.md"
  - id: "SPEC-065"
    title: "Integer Arguments Are Exact: configure() Ceilings and the Sink Validators"
    description: "Makes configure() refuse a non-int payload ceiling and store an accepted one as an exact int, and makes the sink-side validators test and return the exact builtin."
    spec_status: "Completed"
    depends_on: ["SPEC-017", "SPEC-034", "SPEC-047", "SPEC-049", "SPEC-055", "SPEC-057"]
    path: "docs/specs/SPEC-065-configure-int-ceilings.md"
  - id: "SPEC-066"
    title: "Numeric Doors Refuse What Is Not a Number: Sink Counts, the Socket Port and the Public Waits"
    description: "Makes every public int-typed sink constructor argument refuse a non-int with a named TypeError instead of flooring it, and gives flush() and shutdown() a defined verdict for inf, NaN and a non-number."
    spec_status: "Completed"
    depends_on: ["SPEC-049", "SPEC-065"]
    path: "docs/specs/SPEC-066-numeric-doors.md"
  - id: "SPEC-067"
    title: "Total Inbound Trace Context — a Bounded Echo and Parsers That Run No Code of the Value"
    description: "Makes continue_trace total over any argument it is handed: the rejection echo is bounded and runs no code of the value, and the four parsers accept only an exact str."
    spec_status: "Completed"
    depends_on: ["SPEC-014", "SPEC-029", "SPEC-064"]
    path: "docs/specs/SPEC-067-total-inbound-trace-context.md"
  - id: "SPEC-068"
    title: "Shutdown-Expiry Bookkeeping: One Announcement per Queued Item, an Expiry That Is Final, a Shutdown From the Drain Thread, a Fork That Resets the Stop Gate"
    description: "Stops an expired shutdown() calling queued items lost, records that an expired shutdown is final, makes a shutdown() on the drain thread return without raising or waiting on itself, and gives a resumed forked child its own stop gate and stop event."
    spec_status: "Completed"
    depends_on: ["SPEC-062"]
    path: "docs/specs/SPEC-068-shutdown-expiry-bookkeeping.md"
  - id: "SPEC-069"
    title: "Encoding and Driver Errors — One Bad Event Costs Only Itself in Every Sink"
    description: "Gives every record-building sink one encode step before its bulk call, so an event it cannot encode costs only itself and one its destination refuses is repaired and delivered, and counts, announces and types the driver errors the SQLite and file sinks let escape."
    spec_status: "Completed"
    depends_on: ["SPEC-026", "SPEC-058", "SPEC-059", "SPEC-061", "SPEC-066"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-069-encoding-and-driver-errors.md"
  - id: "SPEC-070"
    title: "Retry Classification: What a Sink Retries, Per Exception, Per Entry and for an Unreadable 2xx"
    description: "Makes every retry loop in the sinks ask a declared predicate whether an exception is worth another attempt, classifies a rejected queue entry per service from the vendor's documented codes, counts a 2xx whose body could not be read in every sink that reads a body, and records the deliberate exceptions in one table."
    spec_status: "Completed"
    depends_on: ["SPEC-061", "SPEC-066", "SPEC-068"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-070-retry-classification.md"
  - id: "SPEC-071"
    title: "Shared Kit, Part One: import_extra, One Injected-Client Refusal and the Chunker Rule"
    description: "Moves the sinks' lazy extra imports, their injected-client refusal and SQS's chunk boundary into shared helpers, refuses the build options eight sinks silently ignore beside an injected client, routes configure()'s and the sinks' type doors on the real type, and pins first the rosters those moves can reach."
    spec_status: "Completed"
    depends_on: ["SPEC-041", "SPEC-043", "SPEC-049", "SPEC-059", "SPEC-061", "SPEC-065", "SPEC-066", "SPEC-080"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-071-shared-kit-part-one.md"
  - id: "SPEC-072"
    title: "Verdict Contract and Delivery Engine"
    description: "Adds the optional per-event Verdict returned by deliver(batch), one delivery engine that resends only retryable events and writes a sink-owned counter object, and the worker, orphan and inline-emit paths that run it, proven against test sinks before any shipped sink adopts it."
    spec_status: "Completed"
    depends_on: ["SPEC-027", "SPEC-058", "SPEC-059", "SPEC-061", "SPEC-062", "SPEC-066", "SPEC-068", "SPEC-070", "SPEC-080"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-072-verdict-contract-and-delivery-engine.md"
  - id: "SPEC-073"
    title: "The HTTP Family on the Delivery Engine"
    description: "Puts HTTPSink and its eight shipped subclasses on SPEC-072's delivery engine: each offers deliver, one request per chunk per round, its emit runs the same engine inline, the three per-record readers return per-event outcomes through one shared unreadable-response method, every documented counter keeps its 1.x name and unit through a family-neutral run context, and a third-party subclass that overrides emit or _handle_response keeps its 1.x path."
    spec_status: "Completed"
    depends_on: ["SPEC-018", "SPEC-027", "SPEC-038", "SPEC-056", "SPEC-058", "SPEC-059", "SPEC-062", "SPEC-066", "SPEC-070", "SPEC-072"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-073-http-family-on-the-delivery-engine.md"
  - id: "SPEC-074"
    title: "The Delivery Engine for the SDK and Driver Sinks, Including Id-Keyed Batch Results"
    description: "Puts the queue-service, database, broker and socket sinks on SPEC-072's engine through a per-event deliver, reads Id-keyed batch results in one shared function, and deletes their eleven retry loops, backoff constants and hand-built loss reports while every documented counter and losses() stays true."
    spec_status: "Completed"
    depends_on: ["SPEC-061", "SPEC-066", "SPEC-068", "SPEC-069", "SPEC-070", "SPEC-071", "SPEC-072", "SPEC-073"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-074-engine-for-sdk-and-driver-sinks.md"
  - id: "SPEC-075"
    title: "Wrappers Map Verdicts; MultiSink Keeps Calling Each Child's emit"
    description: "The filtering, transforming and delegating wrappers offer deliver exactly when the sink they wrap does, map its verdict back to their own batch and count only their own decisions, while MultiSink offers none and keeps calling each child's emit — so a wrapped engine sink is retried and counted as it would be alone."
    spec_status: "Completed"
    depends_on: ["SPEC-017", "SPEC-058", "SPEC-059", "SPEC-066", "SPEC-072", "SPEC-073", "SPEC-074", "SPEC-080"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-075-wrappers-map-verdicts.md"
  - id: "SPEC-076"
    title: "The Closed-Guard Helper"
    description: "Gives the shipped sinks that release a transport one private helper, in two modes, for the transport lock, the idempotent close and the refusal after close, and defines what a close does when it overlaps a call still inside the sink and what a closed sink's deliver answers."
    spec_status: "Completed"
    depends_on: ["SPEC-028", "SPEC-032", "SPEC-061", "SPEC-069", "SPEC-072", "SPEC-074"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-076-closed-guard-helper.md"
  - id: "SPEC-077"
    title: "Runtime Holds Today's Lifecycle State, With No Behaviour Change, and the Model Test Drives It"
    description: "Moves the lifecycle bookkeeping that lives in module globals onto one Runtime object, adds a State read off today's flags, and extends the model test to drive every lifecycle call against a state table."
    spec_status: "Draft"
    depends_on: ["SPEC-045", "SPEC-046", "SPEC-050", "SPEC-054", "SPEC-062", "SPEC-066", "SPEC-068"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-077-runtime-holds-lifecycle-state.md"
  - id: "SPEC-078"
    title: "The Owed-Close Registry and Checked Lifecycle Transitions"
    description: "Puts every owed and in-flight sink close in one registry that spends the closer grace once per shutdown, and makes the stored lifecycle State the authority: every lifecycle call checks it under the runtime's lock and has a defined answer in every state."
    spec_status: "Draft"
    depends_on: ["SPEC-045", "SPEC-046", "SPEC-050", "SPEC-054", "SPEC-062", "SPEC-066", "SPEC-068", "SPEC-077"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-078-owed-close-registry-and-checked-transitions.md"
  - id: "SPEC-079"
    title: "Fork: One Walk From the Runtime's Roots, the Global Lock Roster, and sink_factory="
    description: "Repairs a forked child by re-creating the package's global locks from one explicit roster and reaching every sink through one bounded walk from the runtime's roots, deletes the module-wide walk and the separate inheritance marking, and adds sink_factory= so each process can build a sink of its own."
    spec_status: "Draft"
    depends_on: ["SPEC-039", "SPEC-042", "SPEC-044", "SPEC-053", "SPEC-054", "SPEC-068", "SPEC-072", "SPEC-077", "SPEC-078", "SPEC-080"]
    arc: "stability-redesign"
    path: "docs/specs/SPEC-079-fork-one-walk-roster-and-sink-factory.md"
  - id: "SPEC-080"
    title: "@trace Intake by Real Type — a Lying Argument Is Refused or Traced at Decoration, Never Absorbed on Every Call"
    description: "Makes @trace route its name= argument, the span-name fallback and its refusal messages on each value's real type, keeping exact str, so no argument decorates cleanly and then fails every call."
    spec_status: "Completed"
    depends_on: ["SPEC-055", "SPEC-063", "SPEC-067"]
    path: "docs/specs/SPEC-080-trace-intake-by-real-type.md"
