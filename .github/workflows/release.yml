name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate: reuse the existing CI so a publish can never run on a red build.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # full history + tags so the version can be derived

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # Every merge publishes, so a bad artifact turns main red at upload time.
      # Catch the common rejections here instead, where the error is legible:
      #   - a local version segment (+<hash>), which PyPI refuses outright
      #   - malformed metadata or a README that fails to render on the project page
      - name: Verify distributions are publishable
        run: |
          ls -l dist/
          if ls dist/ | grep -q '+'; then
            echo "::error::Built version carries a local segment (+); PyPI will reject it."
            exit 1
          fi
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          test "$(ls dist/*.whl | wc -l)" -eq 1
          python -m twine check dist/*

      # A release upload cannot be undone, so refuse to publish under a number that
      # disagrees with the tag that asked for it (FR-005).
      - name: Verify the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(basename dist/*.tar.gz .tar.gz)
          built="${built#log_foundry-}"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag, but the build produced $built."
            exit 1
          fi

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-dev:
    # Every merge to main ships an X.Y.Z.devN pre-release to PyPI. pip ignores pre-releases
    # unless --pre is passed, so `pip install log-foundry` still resolves to the stable release.
    # This keeps the upload path exercised, so a tagged release is never the first attempt.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/log-foundry
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish dev pre-release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # tolerate a re-run that produces a duplicate dev version

  publish-release:
    # A pushed version tag (vX.Y.Z) ships a stable release to PyPI.
    # Deliberately NO skip-existing: re-pushing a tag whose version is already on PyPI must
    # fail loudly rather than report a green, silently-did-nothing run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/log-foundry
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
