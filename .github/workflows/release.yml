name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate: reuse the existing CI so a publish can never run on a red build.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history + tags so the version can be derived
          # The build reads git history; it never writes. Publishing authenticates to PyPI with
          # OIDC, not this token, so nothing downstream needs the credential left on disk.
          persist-credentials: false

      # One version is enough here, unlike the CI matrix: the wheel is pure Python
      # (`py3-none-any`) so the building interpreter does not appear in the artifact, and
      # `requires-python` is read from pyproject.toml rather than from this runtime. Build on the
      # floor and test on every supported version — that is the correct split (SPEC-013 FR-001).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned rather than `--upgrade`, because this is the job that produces the artifact
      # every consumer installs, and an unpinned install here means the build FRONTEND is
      # whatever PyPI served that minute. Scorecard's `PinnedDependenciesID` has been open on
      # this line ("pipCommand not pinned by hash") for exactly that reason.
      #
      # Read the scope narrowly, because the obvious reading is wrong. `build` is only the
      # frontend: it creates an isolated environment and resolves the actual BACKEND —
      # `poetry-core` and `poetry-dynamic-versioning` — live from PyPI, bounded only by the
      # ranges in `[build-system] requires`. Those are what write the wheel, and they are still
      # unpinned after this change. Closing that needs a `PIP_CONSTRAINT` file, which nothing
      # here would maintain either.
      #
      # Version pins, not hashes, so Scorecard's finding is NARROWED as a risk and unchanged as
      # a report: its check clears a `pip install` only for `--require-hashes` or a bare local
      # wheel, so this alert keeps its text and its score. Hash-pinning would need a
      # requirements file covering both tools and their whole transitive closure.
      #
      # THESE TWO MOVE BY HAND, and nothing here will tell you when they are stale. Unlike
      # `.github/actions/install-poetry`, which derives its pin from `poetry.lock`, these have
      # nothing in the repository to derive themselves from: Dependabot cannot see a `run:`
      # step, no schedule checks them, and a lagging build frontend just keeps working. The
      # fix that would close it is known and deliberately not taken here — put `build` and
      # `twine` in a Poetry group so the `pip` ecosystem maintains them, then read the pin out
      # of the lock the way `scripts/make-sbom.py`'s `locked_version()` already pins
      # `cyclonedx-bom`. That edits `pyproject.toml` and regenerates `poetry.lock`, which is a
      # dependency change rather than a CI one, so it is recorded here to be done rather than
      # left as an unwritten intention.
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.0 twine==7.0.0
          python -m build

      # A bad artifact turns a release red at upload time. This ran on every merge while
      # `publish-dev` did, which caught such an artifact one merge after it was built; with that
      # job disabled below the check still runs here, but the first upload it now guards is a
      # TAG. Cheap, and the only thing still standing between a bad artifact and a release.
      # Catch the common rejections here, where the error is legible:
      #   - a local version segment (+<hash>), which PyPI refuses outright
      #   - malformed metadata or a README that fails to render on the project page
      - name: Verify distributions are publishable
        run: |
          ls -l dist/
          if ls dist/ | grep -q '+'; then
            echo "::error::Built version carries a local segment (+); PyPI will reject it."
            exit 1
          fi
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          test "$(ls dist/*.whl | wc -l)" -eq 1
          python -m twine check dist/*

      # A release upload cannot be undone, so refuse to publish under a number that
      # disagrees with the tag that asked for it (FR-005).
      - name: Verify the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(basename dist/*.tar.gz .tar.gz)
          built="${built#log_foundry-}"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag, but the build produced $built."
            exit 1
          fi

      # Runs on EVERY release-workflow run, not only on a tag. Same reasoning as publish-dev
      # below: a step first exercised at release time is a step first debugged at release time.
      # The script installs the built wheel with every extra into a throwaway virtualenv and
      # describes that, so the SBOM is the closure a consumer actually gets — and it asserts the
      # result rather than trusting it (empty, 0.0.0, or leaked build tooling all exit non-zero).
      - name: Generate CycloneDX SBOM
        run: python scripts/make-sbom.py --output "sbom.cdx.json"

      # FR-002: the SBOM must not name a version that was never published. The build already
      # checks the tag against the sdist; this checks the SBOM against the same sdist, so all
      # three agree or the release stops here.
      - name: Verify the SBOM version matches the build
        run: |
          built=$(basename dist/*.tar.gz .tar.gz)
          built="${built#log_foundry-}"
          sbom=$(python -c "import json;print(json.load(open('sbom.cdx.json'))['metadata']['component']['version'])")
          echo "built=$built sbom=$sbom"
          if [ "$sbom" != "$built" ]; then
            echo "::error::SBOM version $sbom disagrees with the built distribution $built."
            exit 1
          fi

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  publish-dev:
    # WHAT THIS JOB IS FOR, in the past tense because it is switched off below. Every merge to
    # main shipped an X.Y.Z.devN pre-release to PyPI. pip ignores pre-releases unless --pre is
    # passed, so `pip install log-foundry` still resolved to the stable release. It kept the
    # upload path exercised, so a tagged release was never the first attempt.
    #
    # ── DISABLED, TEMPORARILY, AND NOT BECAUSE THE JOB IS WRONG ──────────────────────────
    # The `pypi` environment gained a deployment-branch policy admitting only `v*` TAGS, so a
    # deployment from `refs/heads/main` is refused before the job's first step runs: it fails in
    # about a second with no steps and no log, and every merge to main has been red since. The
    # job body is left standing rather than deleted, for its `environment:` block, its reasoning
    # and plain legibility — not to preserve the action pin, which `publish-release` carries
    # identically a few lines below.
    #
    # TO RESTORE, and the branch policy is NOT the only thing in the way. That environment
    # carries TWO protection rules: the `v*` tag policy above, and `required_reviewers`. Admitting
    # `main` and restoring the `if:` therefore turns a red main into a main that sits in Waiting
    # for a manual deployment approval on EVERY merge, which is arguably worse. The two ways out:
    #
    #   - accept an approval per merge, or
    #   - give this job an environment of its own, without the reviewer rule. Before assuming
    #     that needs work on PyPI's side, CHECK: the environment name is an OPTIONAL claim in
    #     Trusted Publishing, verified only when the publisher was registered with one. If the
    #     `log-foundry` publisher has its Environment field blank, no PyPI-side change is needed
    #     at all; if it is set to `pypi`, ADD a second publisher for the new name. Do not take
    #     this comment's word for which case applies — it was written without PyPI access.
    #
    # Then put `if: github.ref == 'refs/heads/main'` back.
    #
    # What this costs while it is off: merges to main publish no `X.Y.Z.devN` pre-release, so the
    # settled decision that "merges to `main` publish a `.devN` pre-release" (SPEC-012) is
    # suspended, and the upload path is no longer exercised between tags — which means the next
    # `v*` tag IS the first attempt, the exact thing this job exists to prevent. Deliberate and
    # temporary; the tag path itself is untouched, since `publish-release` and `github-release`
    # depend on `build` and on each other, never on this job.
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/log-foundry
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Pinned by SHA, deliberately departing from the rolling `release/v1` branch PyPA
      # recommends. This is the one job holding a PyPI publishing token, so a mutable ref here
      # is the highest-consequence unpinned reference in the repository: a lagging pin fails
      # loudly at release time, a compromised action fails silently forever. Dependabot's
      # github-actions ecosystem moves the pin (SPEC-022 FR-004, FR-007).
      - name: Publish dev pre-release to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true   # tolerate a re-run that produces a duplicate dev version

  publish-release:
    # A pushed version tag (vX.Y.Z) ships a stable release to PyPI.
    # Deliberately NO skip-existing: re-pushing a tag whose version is already on PyPI must
    # fail loudly rather than report a green, silently-did-nothing run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/log-foundry
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # SHA-pinned for the same reason as publish-dev above.
      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    # Publish the SBOM where a consumer can actually fetch it (SPEC-023 FR-003). Until this job
    # existed the repository had tags but no GitHub Releases at all, so there was nothing for a
    # release asset to attach to.
    #
    # `needs: publish-release` is the ordering that matters: a GitHub Release must never exist for
    # a version that failed to reach PyPI. This job is the ONLY one here holding `contents: write`,
    # and it deliberately does not request `id-token` — it authenticates to the GitHub API with the
    # job token and never touches PyPI. The publish jobs above keep the inverse.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release and upload its asset; nothing else
    steps:
      # Sparse and shallow: this job needs only the notes directory, and it is the one job here
      # holding `contents: write`, so it checks out as little as possible and keeps no credential
      # on disk. Cone mode off, because the pattern is a single directory rather than a cone.
      - name: Check out the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/release-notes
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      # Tag-qualified so a downloaded file identifies itself without its surrounding page.
      - name: Name the asset for its version
        run: mv sbom.cdx.json "log-foundry-${GITHUB_REF_NAME#v}.cdx.json"

      # `gh` rather than a third-party action: one fewer pin upstream of a job that can write to
      # this repository.
      #
      # THE ORDER IS THE WHOLE POINT. This repository has immutable releases enabled, so a release's
      # assets are frozen the moment it is published — `gh release upload` against a published
      # release returns `HTTP 422: Cannot upload assets to an immutable release`, which is exactly
      # how v0.10.0 shipped without its SBOM. A draft is not yet immutable, so the sequence must be
      # create-as-draft → upload → publish, never create → upload.
      #
      # Deliberately NOT idempotent, because immutability means it cannot be: an existing published
      # release can never be amended, so a re-run that quietly "succeeded" would be lying. It fails
      # loudly instead and says what a human has to do.
      - name: Create the GitHub Release with its SBOM attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="log-foundry-${GITHUB_REF_NAME#v}.cdx.json"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Immutable releases cannot be" \
                 "amended — delete it and re-run this workflow to attach the SBOM."
            exit 1
          fi
          # Notes come from `docs/release-notes/<tag>.md` when that file exists, so a release
          # worth explaining can explain itself; otherwise `--generate-notes` builds the changelog
          # server-side from the commits since the previous tag, which is right for a routine patch
          # and wrong for a release carrying two audit arcs — for v1.0.0 it would have rendered
          # nearly a hundred spec-level commit subjects with no user-facing framing.
          #
          # Written into the DRAFT, never attached afterwards. Same reasoning as the asset upload
          # below: the immutability that freezes assets at publish is not something to bet against
          # on the body, and a follow-up `gh release edit` would be exactly that bet.
          #
          # Two ways this silently falls back, both worth knowing before cutting a tag. The
          # checkout above takes `github.ref`, so the notes must exist in the TAGGED COMMIT's
          # tree — tagging a commit that predates the notes file gets generated notes and a
          # green job. And the lookup is by exact tag name, so notes written for `v1.0.0` do
          # nothing for any other tag. Neither is an error: a missing file is the fallback
          # working as designed.
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "using curated notes from $notes"
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::no $notes; generating notes from the commit range. If this tag was meant to carry curated notes, the file must exist in the TAGGED commit and be named for the tag."
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "published $GITHUB_REF_NAME with $asset attached"
