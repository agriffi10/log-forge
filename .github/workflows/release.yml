name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate: reuse the existing CI so a publish can never run on a red build.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history + tags so the version can be derived
          # The build reads git history; it never writes. Publishing authenticates to PyPI with
          # OIDC, not this token, so nothing downstream needs the credential left on disk.
          persist-credentials: false

      # One version is enough here, unlike the CI matrix: the wheel is pure Python
      # (`py3-none-any`) so the building interpreter does not appear in the artifact, and
      # `requires-python` is read from pyproject.toml rather than from this runtime. Build on the
      # floor and test on every supported version — that is the correct split (SPEC-013 FR-001).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # Every merge publishes, so a bad artifact turns main red at upload time.
      # Catch the common rejections here instead, where the error is legible:
      #   - a local version segment (+<hash>), which PyPI refuses outright
      #   - malformed metadata or a README that fails to render on the project page
      - name: Verify distributions are publishable
        run: |
          ls -l dist/
          if ls dist/ | grep -q '+'; then
            echo "::error::Built version carries a local segment (+); PyPI will reject it."
            exit 1
          fi
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          test "$(ls dist/*.whl | wc -l)" -eq 1
          python -m twine check dist/*

      # A release upload cannot be undone, so refuse to publish under a number that
      # disagrees with the tag that asked for it (FR-005).
      - name: Verify the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(basename dist/*.tar.gz .tar.gz)
          built="${built#log_foundry-}"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag, but the build produced $built."
            exit 1
          fi

      # Runs on EVERY release-workflow run, not only on a tag. Same reasoning as publish-dev
      # below: a step first exercised at release time is a step first debugged at release time.
      # The script installs the built wheel with every extra into a throwaway virtualenv and
      # describes that, so the SBOM is the closure a consumer actually gets — and it asserts the
      # result rather than trusting it (empty, 0.0.0, or leaked build tooling all exit non-zero).
      - name: Generate CycloneDX SBOM
        run: python scripts/make-sbom.py --output "sbom.cdx.json"

      # FR-002: the SBOM must not name a version that was never published. The build already
      # checks the tag against the sdist; this checks the SBOM against the same sdist, so all
      # three agree or the release stops here.
      - name: Verify the SBOM version matches the build
        run: |
          built=$(basename dist/*.tar.gz .tar.gz)
          built="${built#log_foundry-}"
          sbom=$(python -c "import json;print(json.load(open('sbom.cdx.json'))['metadata']['component']['version'])")
          echo "built=$built sbom=$sbom"
          if [ "$sbom" != "$built" ]; then
            echo "::error::SBOM version $sbom disagrees with the built distribution $built."
            exit 1
          fi

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  publish-dev:
    # Every merge to main ships an X.Y.Z.devN pre-release to PyPI. pip ignores pre-releases
    # unless --pre is passed, so `pip install log-foundry` still resolves to the stable release.
    # This keeps the upload path exercised, so a tagged release is never the first attempt.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/log-foundry
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Pinned by SHA, deliberately departing from the rolling `release/v1` branch PyPA
      # recommends. This is the one job holding a PyPI publishing token, so a mutable ref here
      # is the highest-consequence unpinned reference in the repository: a lagging pin fails
      # loudly at release time, a compromised action fails silently forever. Dependabot's
      # github-actions ecosystem moves the pin (SPEC-022 FR-004, FR-007).
      - name: Publish dev pre-release to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true   # tolerate a re-run that produces a duplicate dev version

  publish-release:
    # A pushed version tag (vX.Y.Z) ships a stable release to PyPI.
    # Deliberately NO skip-existing: re-pushing a tag whose version is already on PyPI must
    # fail loudly rather than report a green, silently-did-nothing run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/log-foundry
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # SHA-pinned for the same reason as publish-dev above.
      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    # Publish the SBOM where a consumer can actually fetch it (SPEC-023 FR-003). Until this job
    # existed the repository had tags but no GitHub Releases at all, so there was nothing for a
    # release asset to attach to.
    #
    # `needs: publish-release` is the ordering that matters: a GitHub Release must never exist for
    # a version that failed to reach PyPI. This job is the ONLY one here holding `contents: write`,
    # and it deliberately does not request `id-token` — it authenticates to the GitHub API with the
    # job token and never touches PyPI. The publish jobs above keep the inverse.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release and upload its asset; nothing else
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      # Tag-qualified so a downloaded file identifies itself without its surrounding page.
      - name: Name the asset for its version
        run: mv sbom.cdx.json "log-foundry-${GITHUB_REF_NAME#v}.cdx.json"

      # `gh` rather than a third-party action: one fewer pin upstream of a job that can write to
      # this repository. Idempotent on re-run — a re-pushed tag replaces the asset (`--clobber`)
      # instead of failing on "release already exists".
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="log-foundry-${GITHUB_REF_NAME#v}.cdx.json"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; updating its asset"
          else
            # --generate-notes builds the changelog server-side from the commits since the
            # previous tag, so this job needs no checkout and no history.
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
