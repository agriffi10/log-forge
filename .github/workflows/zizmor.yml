name: Zizmor

# Static analysis of the workflows themselves — template injection, excessive permissions,
# unpinned actions, artifact poisoning. The reason this repository wants it: release.yml holds
# `id-token: write` against PyPI Trusted Publishing, so a defect in a workflow file is a defect
# upstream of every consumer's `pip install` (SPEC-022 FR-006).

# Path-filtered on both triggers: a pull request that touches none of the files this audit reads
# cannot change its verdict, and re-running it on the push that merges a tree already audited on
# the pull request answers the same question twice. Measured over the two weeks to 2026-09-01:
# 29 pull-request runs and 21 push runs, the overwhelming majority against trees with no auditable
# file changed at all.
#
# THE LIST IS EVERY INPUT ZIZMOR READS, NOT JUST THE WORKFLOWS — and getting that wrong is
# unrecoverable here, because unlike scorecard.yml and pip-audit.yml this workflow has NO
# schedule: a run the filter skips is not deferred a week, it never happens. zizmor also audits
# `.github/dependabot.yml` (the `dependabot-cooldown` rule) and `.pre-commit-config.yaml`. The
# dependabot file is the one that bites: this repository's cooldown settings are load-bearing —
# `CLAUDE.md` names them and names that rule — so a pull request dropping a `cooldown` block
# would otherwise merge entirely unaudited.
#
# The filter does not let a new zizmor release go unapplied. The action is SHA-pinned, so the
# analyzer only ever changes by an edit to a file under `.github/workflows/` — which is exactly
# what re-triggers this.
#
# `.github/actions/**` and `.pre-commit-config.yaml` are listed although neither exists here yet:
# a filter that silently stops covering an input the moment one is added is the failure mode worth
# pre-empting, and it is the same failure mode `.github/dependabot.yml` had been an instance of.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".pre-commit-config.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

jobs:
  zizmor:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF results to code scanning
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # this job only reads files; don't leave a token on disk

      # Pinned by SHA because this action publishes no moving major tag — only specific
      # versions (v0.5.7, v0.6.0, v0.6.1). A `@v0` reference does not exist and must not be
      # invented. Dependabot's github-actions ecosystem moves this pin like any other.
      #
      # `advanced-security` defaults to true, which emits SARIF to code scanning and exits
      # zero rather than failing the job. That is deliberate, and it matches how CodeQL
      # reports here: Advanced Security owns triage. To make a finding blocking, use a
      # repository ruleset — not a job failure.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
