name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:   # allow release.yml to run this same gate before publishing

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report both legs; one version failing shouldn't hide the other's result
      matrix:
        # Every supported version runs the full gate. `requires-python = ">=3.12"` is only worth
        # what the test run behind it proves — a 3.13-only call on a rarely-exercised path would
        # otherwise surface as an AttributeError in a consumer's production Lambda (SPEC-013 FR-001).
        python-version: ["3.12", "3.13"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy

      - name: Test (pytest)
        run: poetry run pytest
