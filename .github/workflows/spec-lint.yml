name: Spec Lint

on:
  pull_request:
    paths:
      - "docs/specs/**"
      - "scripts/spec-lint.sh"
      - ".github/workflows/spec-lint.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here runs git; don't leave a token on disk
      - name: Run spec-lint
        run: sh scripts/spec-lint.sh docs/specs
