name: Spec Lint

on:
  pull_request:
    paths:
      - "docs/specs/**"
      - "docs/invariants.md"
      - "docs/templates/spec-template.md"
      - "scripts/spec-lint.sh"
      - "scripts/spec-lint-test.sh"
      - "tests/spec-lint/**"
      - ".github/workflows/spec-lint.yml"
  # The same filter as the pull_request trigger above, which this one was missing: the lint reads
  # `docs/specs/` and the script that lints it, so a merge touching neither cannot change its
  # verdict. The asymmetry was the oversight — a filtered pull request and an unfiltered push mean
  # every merge re-ran a lint that had already passed on the identical tree.
  push:
    branches: [main]
    paths:
      - "docs/specs/**"
      - "docs/invariants.md"
      - "docs/templates/spec-template.md"
      - "scripts/spec-lint.sh"
      - "scripts/spec-lint-test.sh"
      - "tests/spec-lint/**"
      - ".github/workflows/spec-lint.yml"

permissions:
  contents: read

jobs:
  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here runs git; don't leave a token on disk
      # The corpus first: a green lint over the live specs proves the specs pass, and only the
      # corpus proves a check still fires. docs/invariants.md is in the paths above because the
      # lint reads its numbering — a renumbered page can fail a spec nobody touched.
      - name: Run the spec-lint corpus
        run: sh scripts/spec-lint-test.sh
      - name: Run spec-lint
        run: sh scripts/spec-lint.sh docs/specs
