name: Docs Lint

# Holds the always-loaded tier to its budgets and the digest/register split to its shape
# (scripts/docs-lint.sh). Until this existed the rules were prose only, in this file's own
# process.md §5 and CLAUDE.md, and they lost anyway: CLAUDE.md grew from 7,583 bytes on
# 2026-07-09 to 89,340 on 2026-09-02, monotonically, while both documents named the
# violation in the present tense throughout.
#
# Deliberately NOT path-filtered, unlike spec-lint.yml beside it. That filter is sound
# because a merge touching neither docs/specs/ nor the lint script cannot change its
# verdict. This one is the opposite case: the failure it exists to catch is growth
# arriving in whichever document nobody thought to list, so a filter would defeat the
# gate. The script is POSIX sh over a handful of files and costs about a second.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here runs git; don't leave a token on disk
      # Parse first, as its own step. A syntax error partway through a shell script can end
      # the run with status 0 — the linter never reaches its checks and CI goes green on a
      # linter that did nothing. That happened once while this script was being written.
      - name: Check the linter itself parses
        run: sh -n scripts/docs-lint.sh
      # The corpus proves the CHECKS work. Running the linter against this repo's own
      # documents only proves the documents pass — a linter whose checks have stopped
      # firing is indistinguishable from a healthy repo, which is how four rounds of
      # regressions all reached main.
      - name: Prove the linter's checks still fire
        run: sh scripts/docs-lint-test.sh
      - name: Hold the always-loaded tier to its budgets
        run: sh scripts/docs-lint.sh
