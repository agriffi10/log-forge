name: Install Poetry
description: >-
  Installs the exact Poetry that generated poetry.lock, derived from the lock rather than pinned
  to a literal. Requires the repository to be checked out at the workspace root.

runs:
  using: composite
  steps:
    # Pinned, and DERIVED rather than written down. Dependabot's `pip` ecosystem reads dependency
    # FILES and never a `run:` step, so a literal `poetry==X.Y.Z` in a workflow would be a pin
    # nothing maintains — worse than an unpinned install, because it reads as maintained. Reading
    # the version out of `poetry.lock`'s own header means the pin cannot drift from the lock.
    #
    # Do not replace this with a literal on the theory that drift would be caught: measured against
    # this repository's lock, every Poetry from 2.0.1 to 2.4.2 reads it and exits 0. Compatibility
    # is gated by the lock's `lock-version`, which those releases share, while the generator name in
    # the header is a comment nothing reads. Poetry 1.8.5 does fail — on the PEP 621 `[project]`
    # table, not on the lock. A stale literal pin would have been silent across that whole range.
    #
    # THIS LIVES IN ONE FILE ON PURPOSE, and the reason is what the step BECAME rather than what it
    # replaced. On `main` the duplication was two lines (`- name: Install Poetry` /
    # `run: pipx install poetry`), which no action is worth. Pinning turned it into a version
    # derivation, a shape check, an install and an agreement check — and the first draft of this
    # change triplicated all of that, byte-identically, with nothing checking the three stayed in
    # agreement. That is the shape `zizmor.yml`'s own comment names ("a roster maintained by hand
    # rots") after that file's path filter was got wrong twice, and `pip-audit.yml` has no
    # `pull_request` trigger, so its copy would first have been exercised as a red `main`.
    #
    # The usual cost of centralising is low here: a local action needs no SHA pin, `zizmor.yml`
    # already path-filters `.github/actions/**` (on both its triggers) so this file is audited from
    # the moment it exists, and `ci.yml` has no path filter, so every pull request runs it.
    #
    # `--force` is load-bearing, not tidiness: `pipx install` against a package pipx already holds
    # prints "already seems to be installed. Not modifying existing installation" and exits **0**,
    # so on any image shipping Poetry the pin would be silently ignored and the step still green.
    # The ubuntu-24.04 image does not ship Poetry today; this does not depend on that staying true.
    - name: Install the Poetry that generated poetry.lock
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n '1s/.*@generated by Poetry \([^ ]*\).*/\1/p' poetry.lock)"
        # Two checks, not one. `sed` captures the next whitespace-delimited TOKEN, which is a
        # version only if the header is shaped as expected — against a header reading
        # "@generated by Poetry and should not be changed" it captures the word "and", the
        # emptiness test passes, and the failure surfaces four lines later as pipx's own
        # "Unable to parse package spec: poetry==and". Non-zero either way, but the guard written
        # to explain it never fires and the message it prints first is wrong. Measured; a review
        # found it by feeding malformed headers in rather than by reading this.
        case "$version" in
          "") echo "::error::poetry.lock's header line names no Poetry version"; exit 1 ;;
          [0-9]*) : ;;
          *) echo "::error::poetry.lock's header names '$version', which is not a version"; exit 1 ;;
        esac
        echo "pinning Poetry to $version, the version that generated poetry.lock"
        pipx install --force "poetry==$version"
        # Asks the `poetry` a later step will actually resolve, not the one pipx reports writing:
        # a shim earlier on PATH is the case that separates the two, and it is caught here.
        installed="$(poetry --version | sed -n 's/.*version \([^)]*\)).*/\1/p')"
        if [ "$installed" != "$version" ]; then
          echo "::error::installed Poetry $installed but poetry.lock was generated by $version"
          exit 1
        fi
