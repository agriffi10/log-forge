# The Logstash pipeline the integration suite posts to (SPEC-041 FR-003).
#
# A STOCK `http` INPUT, DELIBERATELY. No `codec` and no `additional_codecs`, because the whole
# question FR-003 asks is what a user gets with a Logstash they have not configured for this
# library. Adding either here would make the test pass by arranging its own answer -- the sink
# would be verified against a Logstash configured to suit it, which proves nothing about the
# default anyone actually deploys.
#
# The output goes to Redis rather than to a file so a test can read back WHAT LOGSTASH PARSED,
# not merely that a request returned 200. `logstash-output-redis` ships in the image. A file
# output would put the runner's uid against the image's uid 1000, and a `stdout` output would
# need the docker CLI inside a test.

input {
  http {
    port => 5044
  }
}

output {
  redis {
    host => "redis"
    data_type => "list"
    key => "logstash-parsed"
  }
}
