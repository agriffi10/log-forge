[project]
name = "log-forge"
version = "0.1.0"
description = "Generate logs for your console and JSON events for downstream consumption."
authors = [
    { name = "Andrew Griffith" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

# Optional features. Install with: pip install log-forge[sqs]
[project.optional-dependencies]
sqs = ["boto3>=1.34"]

[tool.poetry]
# src layout: map the package from the src/ directory
packages = [
    { include = "log_forge", from = "src" },
]

# Non-Python files to include in the package
include = [
    "src/log_forge/py.typed",  # PEP 561 marker for typed packages
]

# Files to exclude from the package
exclude = [
    "tests/**/*",
    "docs/**/*",
]

# Development-only dependencies (not shipped to consumers).
# Install with: poetry install --with dev
[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.4.0"        # for testing async @trace (guide Phase 8)
pytest-cov = "^7.1.0"
ruff = "^0.5"
mypy = "^1.10"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]             # src layout: make `import log_forge` work without an install
asyncio_mode = "auto"            # async test functions run without an explicit marker
addopts = "--strict-markers"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.mypy]
files = ["src"]
python_version = "3.13"
strict = true
