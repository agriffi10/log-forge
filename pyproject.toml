[project]
# Distribution name on PyPI; the import name matches it (`log_foundry`, see src/).
# The project was originally "log-forge", which PyPI rejects as too similar to the unrelated,
# pre-existing "logforge" project — its similarity check collapses separators.
name = "log-foundry"
# The version is derived from Git tags at build time (poetry-dynamic-versioning).
# Do not add a literal `version` key back here.
dynamic = ["version"]
description = "Generate logs for your console and JSON events for downstream consumption."
authors = [
    { name = "Andrew Griffith" }
]
license = "MIT"
readme = "README.md"
# 3.12 is the floor because that is the newest runtime a large class of deployed AWS Lambda
# fleets is on, and nothing in the library needs 3.13 (SPEC-013 FR-001). CI runs the full gate
# on 3.12 *and* 3.13 — the declaration follows the evidence.
requires-python = ">=3.12"
dependencies = [
]

# Declared explicitly rather than left to poetry-core's derivation from `requires-python`.
# The derived set follows the RANGE, so `>=3.12` produced a `Programming Language :: Python ::
# 3.14` classifier — an assertion of support for a runtime no CI job has ever run. `requires-python`
# is the install-time contract and correctly stays open; a classifier is a claim about what is
# tested, and the two are not the same statement. These list the versions `ci.yml` actually
# gates — its `python-version` matrix is the other half of the pair and carries the same note.
# The coupling is by comment, not by check: a test asserting it would live in `tests/`, which
# this change does not own.
classifiers = [
    # Asserts what the NEXT STABLE TAG will be, not what the current version is. Safe only
    # because PyPI's default project page renders the latest stable release, which is still
    # `v0.10.1` and carries none of this; the artifacts carrying it in the meantime are the
    # `.devN` pre-releases that SECURITY.md declares unsupported and that `pip install` does
    # not select. Their own per-version pages DO show it, so this is narrow, not free.
    # Revisit if the next stable tag is not `v1.0.0`: README still says three public shapes
    # change once, before the API is frozen, and Production/Stable on the default page would
    # then contradict it.
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # Not by the "only what CI runs" rule above — every workflow is `ubuntu-latest`. By
    # source evidence instead: `src/` imports no `fcntl`, `pwd`, `grp` or `posix`, opens no
    # `AF_UNIX` socket and reads no `/dev/null` path, and `_fork.py` guards
    # `os.register_at_fork` with `hasattr` precisely so Windows imports cleanly. A POSIX-only
    # sink would invalidate this line, which is why the evidence is written down.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# No `License :: OSI Approved :: MIT License` classifier: `license = "MIT"` above is a PEP 639
# expression, and PyPI refuses a distribution that carries both.

keywords = [
    "logging",
    "structured-logging",
    "json-logging",
    "observability",
    "trace-context",
    "correlation-id",
    "sqs",
    "elasticsearch",
    "serverless",
]

# Without these the PyPI project page links nowhere: the sidebar is built from this table alone,
# and a reader who arrives from `pip show` has no route to the source, the release notes or the
# vulnerability-reporting channel. The repository is still named `log-forge` — the ORIGINAL name,
# which PyPI rejected for the distribution — so these URLs deliberately do not match the package
# name. See the note on `name` above before "correcting" them.

[project.urls]
Homepage = "https://github.com/agriffi10/log-forge"
Repository = "https://github.com/agriffi10/log-forge"
Documentation = "https://github.com/agriffi10/log-forge#readme"
"Release notes" = "https://github.com/agriffi10/log-forge/releases"
Issues = "https://github.com/agriffi10/log-forge/issues"
Security = "https://github.com/agriffi10/log-forge/security/policy"

# Optional features. Install with: pip install log-foundry[aws]

[project.optional-dependencies]
aws = ["boto3>=1.43.61"]              # SQSSink, SNSSink, KinesisSink, FirehoseSink
sentry = ["sentry-sdk>=2.66.1"]
kafka = ["confluent-kafka>=2.0"]
redis = ["redis>=5.0"]
amqp = ["pika>=1.4.2"]
nats = ["nats-py>=2.6"]
gcp-pubsub = ["google-cloud-pubsub>=2.18"]
azure-eventhubs = ["azure-eventhub>=5.11"]
# clickhouse-connect caps at Python <3.15; marker scopes it so the unbounded project range resolves.
clickhouse = ["clickhouse-connect>=0.7; python_version < '3.15'"]
mongo = ["pymongo>=4.6"]
postgres = ["psycopg[binary]>=3.1"]

[tool.poetry]
# Poetry still requires this field to exist; it is only a placeholder.
# The real value is injected from Git tags during the build.

# src layout: map the package from the src/ directory
packages = [
    { include = "log_foundry", from = "src" },
]

# Non-Python files to include in the package
include = [
    "src/log_foundry/py.typed",  # PEP 561 marker for typed packages
]

# Files to exclude from the package
exclude = [
    "tests/**/*",
    "docs/**/*",
]

# Development-only dependencies (not shipped to consumers).
# Install with: poetry install --with dev
version = "0.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.4.0"        # for testing async @trace (guide Phase 8)
pytest-cov = "^7.1.0"
# The suite is sleep-bound, not CPU-bound: it spends most of its wall clock at single-digit
# CPU, because the bounds this library promises (a 30 s shutdown budget, a backoff, a
# wedged drain) are proved by waiting for them. Two tests block 30 s each. Distributing
# across processes therefore buys almost the whole wall clock back — measured at `e565e22`
# as 125.9 s -> 34.8 s at `-n 12 --dist worksteal`, where caching the dependency install
# could only ever save the 18 s that install takes. The test count that stood here is gone:
# it moved with every spec, and the argument never rested on it.
pytest-xdist = "^3.8"
# Bounded to a minor, not left open. Ruff's DEFAULT rule set is not stable across minors —
# 0.16.0 widened it from 59 rules to 413 — so an open constraint lets a release change what
# CI enforces. `[tool.ruff.lint] select` below is the other half: the bound makes the change
# deliberate, the select makes the set ours.
ruff = ">=0.16,<0.17"
mypy = "^2.3"

# Supply-chain tooling (SPEC-023 FR-007). `optional = true` keeps it OUT of the
# `poetry install --with dev` that every CI matrix leg runs — neither tool is needed to lint,
# typecheck or test, and both drag in dependency trees of their own. The two security workflows
# ask for it explicitly with `--with security`.
#
# In the lockfile rather than fetched ad hoc so the versions are pinned and Dependabot's existing
# `pip` ecosystem maintains them under its cooldown, like every other dependency here.
[tool.poetry.group.security]
optional = true

#
# Both carry a `python = "<4.0"` marker for the same reason `clickhouse-connect` carries one:
# `requires-python = ">=3.12"` has no upper bound, so Poetry solves against a range that runs past
# 4.0, and a dependency capped at `<4.0` makes resolution fail outright. The marker scopes the tool
# instead of narrowing the library's own declared range.
[tool.poetry.group.security.dependencies]
cyclonedx-bom = { version = "^7.3", python = "<4.0" }   # the `cyclonedx-py` CLI (SBOM generation)
pip-audit = { version = "^2.10", python = "<4.0" }      # OSV/PyPI advisory audit of the env


[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
bump = true       # development builds sort after the last release (e.g. 0.0.2.devN)
metadata = false  # drop the +<hash> local segment so PyPI accepts the upload


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.4.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]             # src layout: make `import log_foundry` work without an install
asyncio_mode = "auto"            # async test functions run without an explicit marker
# `-n 12 --dist worksteal` lives HERE rather than in the CI workflow, so the gate a developer runs
# before pushing is the same command CI runs, at the same speed: ~133 s -> ~35 s locally, and the
# pre-push gate is where those 98 s are actually paid for by a human waiting. It also removes a
# divergence — with the flags only in CI, an order-dependent failure could appear there and be
# unreproducible with a bare `poetry run pytest`.
#
# The suite is sleep-bound, not CPU-bound (~133 s of wall clock at well under 10% CPU), because
# this library's promises ARE bounds and a bound is proved by waiting for it; two tests in
# test_orphan_sink_handoff.py block 30 s each. That is why the count is a fixed 12 rather than
# `auto`: workers here are overwhelmingly blocked rather than computing, so `auto` — the CPU
# count, which is 4 on a GitHub runner — leaves most of the win on the table.
#
# `--dist worksteal`, NOT `--dist load`, and this was learned the expensive way. `load` hands each
# worker a fixed slice up front, so the allocation is a deterministic function of the test list —
# and when SPEC-047 added a handful of NATS tests, both 30 s tests landed in the SAME slice and
# the parallel run went from 40.8 s to 71.4 s (three runs, spread 0.1 s: not luck, and it would
# have stayed green in CI while quietly costing 30 s a run). `worksteal` lets an idle worker take
# work from a busy one, which is exactly the long-tail shape here. Measured on the same tree,
# 1,899 passed / 7 skipped every time:
#
#     serial                    133.4 s      -n 8  --dist worksteal   40.0 s
#     -n 8  --dist load          71.4 s      -n 12 --dist worksteal   34.8 s   <- chosen
#     -n 12 --dist load          38.4 s      -n 16 --dist worksteal   34.1 s   (knee)
#
# `loadfile` is worse than either: it keeps a module on one worker, pinning those two 30 s tests
# to one process and flooring the run at ~72 s — measured at both -n 8 and -n 12, though not at
# every worker count, since `-n 1 --dist loadfile` is 125.4 s.
#
# TO OVERRIDE, PASS `-n 0` — it disables distribution entirely (verified: no workers are created)
# and is the right flag for debugging a failure, for `--pdb`, or for reading interleaved output.
# `tests/integration` is run that way in CI for a stronger reason than convenience: those tests
# share nine real services, so distributing them would have them reading each other's writes.
# That one is ENFORCED, not merely configured -- `tests/integration/conftest.py` refuses a
# distributed session, so deleting `-n 0` from the workflow fails loudly instead of producing the
# intermittent cross-talk it used to.
addopts = "--strict-markers -n 12 --dist worksteal"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# Deliberately no `target-version`: ruff infers it from `requires-python`, so the two can never
# drift. If one is ever added it must match the floor above.

[tool.ruff.lint]
# THE RULE SET IS CHOSEN HERE, NOT INHERITED. Ruff's default set is not a stable contract:
# 0.16.0 widened it from 59 rules to 413. Selecting explicitly means a ruff release can add
# rules *inside* a family we asked for, but cannot decide which families CI enforces. The
# `>=0.16,<0.17` bound on the dev dependency is the other half of that.
select = [
    "F",                    # pyflakes
    "E4", "E7", "E9",       # pycodestyle errors. NOT E5: `line-length` above is advisory
                            # today (it feeds `ruff format`, which this repo does not run) and
                            # enough lines in src+tests exceed it that enforcing it is a reflow
                            # sweep, which is its own decision. No count here on purpose: the one
                            # this comment carried was 52, and `3c973b9` measured 86. Get the
                            # current cost from
                            # `ruff check --select E5 --statistics src tests` before deciding.
    "W",
    "I",                    # import sorting
    "B",                    # bugbear
    "UP",                   # pyupgrade — the floor is 3.12, keep the syntax current
    "SIM", "C4", "PIE", "RET", "FURB", "PERF",
    "RUF",
    "S",                    # bandit
    "BLE", "TRY",           # exception hygiene — the decorator's contract is about exceptions
    "LOG", "G",
    "DTZ",                  # naive datetimes: this library stamps every event's timestamp
    "ASYNC",                # @trace is async-aware (SPEC-003)
    "PYI", "YTT", "FLY", "INT", "TC", "FA", "PGH", "EXE", "ISC",
]

# Each entry is a decision with its reason, not a backlog.
ignore = [
    "BLE001",   # THE central one. `except Exception` in a sink is the architecture, not a
                # slip: a broken destination must degrade logging and nothing more, and the
                # decorator must never raise into the caller (arch §4). Eleven of these, all
                # in sinks/ and worker.py, all load-bearing.
    "TRY003",   # messages are written at the raise site; a class per message would add names
                # nothing reads.
    "TRY300",   # "return in else" reads worse than the early return this code uses.
    "TRY400",   # this library IS the logger; it writes to stderr deliberately, and
                # logger.exception is not available to it.
    "S110",     # try/except/pass is the shape of "logging must never break the caller"
                # (arch §4). Every occurrence carries a written reason.
    "SIM105",   # same sites as S110: contextlib.suppress would hide the written reason
                # behind an import.
    "PERF203",  # try/except inside a loop is deliberate in the worker's drain: one bad batch
                # must not abort the rest.
    "UP047",    # PEP 695 `def f[T](...)`. Valid on the 3.12 floor, but rewriting the public
                # `@trace` decorator's generics is a change to the signature users read, and
                # the TypeVar form is not deprecated. Its own PR if ever.
    "RUF002", "RUF003",  # ambiguous-unicode in docstrings/comments: this codebase writes
                # –, ×, → and — on purpose.
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the test framework; the rest are fixtures that only look like secrets, naive
# datetimes under test on purpose, and raises inside a `try` that IS the thing under test.
"tests/**/*.py" = ["S101", "S106", "DTZ001", "TRY301"]
# FileSink and RotatingFileSink hold a handle open ACROSS calls by design — that is what makes
# them a sink rather than a per-event open(). A context manager would close it after one emit.
"src/log_foundry/sinks/file.py" = ["SIM115"]
# These two build an INSERT around a table name because SQL cannot parameterize an identifier.
# The name is run through `valid_identifier` at construction, so it is a plain SQL identifier by
# the time it reaches the f-string, and every VALUE is parameterised. Scoped to these two files
# rather than ignored repository-wide: a future sink that builds SQL less carefully should still
# trip this rule.
"src/log_foundry/sinks/postgres.py" = ["S608"]
"src/log_foundry/sinks/sqlite.py" = ["S608"]
# The integration tests build DDL and SELECTs around a table name they generate themselves --
# a `uuid4().hex` slice, so the table can be created and dropped per test without two runs
# colliding. Scoped to these two files for the same reason the two sinks above are scoped
# individually rather than the rule being switched off for `tests/**`: a future test that
# interpolates something it did not generate should still trip it.
"tests/integration/test_postgres.py" = ["S608"]
"tests/integration/test_clickhouse.py" = ["S608"]
# The NATS outage test stops and restarts its own compose service, because "the server went
# away" is the condition under test and no fake reproduces what the real client does about it.
# Every argument is a literal or a path this module derives from `__file__`; there is no shell
# and no caller input. `docker` is resolved from PATH deliberately -- CI and a developer laptop
# put it in different places.
"tests/integration/test_nats.py" = ["S603", "S607"]
# make-sbom.py exists to drive two virtualenvs it creates itself, so subprocess is the whole job.
# Every argv element is either a literal, a path under a `tempfile.TemporaryDirectory` this script
# just made, or a value read from the repository's own pyproject.toml / poetry.lock. There is no
# caller-supplied input and no shell — `subprocess.run` is given a list, never a string.
"scripts/make-sbom.py" = ["S603"]

[tool.mypy]
files = ["src"]
# Must be the *lowest* supported version, not the newest: mypy checks against this, so a 3.13-only
# API would type-check clean on a 3.12 floor and fail as an AttributeError in a consumer's runtime.
python_version = "3.12"
strict = true
